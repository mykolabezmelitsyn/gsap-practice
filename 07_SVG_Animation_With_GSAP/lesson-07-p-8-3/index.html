<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Your creative coding workspace. Explore GSAP, scroll animation, SVG, Adobe Animate, and generative art."
  />
  <title>Creative Coding Club — Learning Library</title>
  <link href="https://fonts.googleapis.com/css?family=Kanit:300,400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">✳</span>
      Creative Coding Club
    </a>
  </header>
  <main>
    <div class="demo">
      <h2>Click to Clone the Group</h2>
      <svg id="svg" viewBox="0 0 400 400" width="400" height="400">
        <g id="group">
          <rect x="50" y="50" fill="darkblue" width="100" height="100" rx="12" ry="12" stroke="dodgerblue" stroke-width="4"></rect>
          <circle cx="100" cy="100" r="25" fill="dodgerblue" stroke="white" stroke-width="4"></circle>
        </g>
      </svg>
      <br>
      <button id="clear">clear</button>
    </div>
  </main>
</div>
<script type="module" src="scripts.js"></script>
</body>
</html>
