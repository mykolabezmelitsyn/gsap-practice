<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Your creative coding workspace. Explore GSAP, scroll animation, SVG, Adobe Animate, and generative art."
  />
  <title>Creative Coding Club — Learning Library</title>
  <link href="https://fonts.googleapis.com/css?family=Kanit:300,400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">✳</span>
      Creative Coding Club
    </a>
  </header>
  <main>
    <div class="demo">
      <svg viewBox="0 0 550 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern x="0" y="0" id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" viewBox="0 0 40 40">
            <rect id="stripe-red" width="20" height="40" style="fill:red;"></rect>
            <rect id="stripe-black" width="20" height="40" x="20" style="fill:black;"></rect>
          </pattern>
          <pattern id="thin" href="#stripes" patternTransform="scale(0.2) translate(0, 0)"/>
          <pattern id="wide" href="#stripes" patternTransform="scale(5) translate(0, 0)"/>
          <pattern id="rotate" href="#stripes" patternTransform="rotate(45) translate(0, 0)"/>
        </defs>
        <g id="examples">
          <!-- Default pattern view -->
          <rect x="1" y="1" width="39" height="40" style="fill: url(#stripes)"/>

          <rect id="rect-thin" style="fill:url(#thin);" x="1" y="50" width="160" height="100" />
          <rect id="rect-wide" style="fill:url(#wide);" x="170" y="50" width="160" height="100" />
          <rect id="rect-rotate" style="fill:url(#rotate);" x="340" y="50" width="160" height="100"/>
        </g>
      </svg>
    </div>
  </main>
</div>
<script type="module" src="scripts.js"></script>
</body>
</html>
