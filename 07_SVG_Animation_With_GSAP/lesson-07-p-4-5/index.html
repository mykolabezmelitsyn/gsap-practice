<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Your creative coding workspace. Explore GSAP, scroll animation, SVG, Adobe Animate, and generative art."
  />
  <title>Creative Coding Club — Learning Library</title>
  <link href="https://fonts.googleapis.com/css?family=Kanit:300,400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">✳</span>
      Creative Coding Club
    </a>
  </header>
  <main>
    <div id="demo1">
      <svg viewBox="0 0 600 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:bx="https://boxy-svg.com">
        <defs>
          <style bx:fonts="Bevan">@import url(https://fonts.googleapis.com/css2?family=Bevan%3Aital%2Cwght%400%2C400%3B1%2C400&amp;display=swap);</style>
          <filter id="drop-shadow-filter-0" color-interpolation-filters="sRGB" x="-500%" y="-500%" width="1000%" height="1000%" bx:preset="drop-shadow 1 10 10 6 0.45 rgba(0,0,0,0.3)">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"></feGaussianBlur>
            <feOffset dx="10" dy="10"></feOffset>
            <feComponentTransfer result="offsetblur">
              <feFuncA id="spread-ctrl" type="linear" slope="0.9"></feFuncA>
            </feComponentTransfer>
            <feFlood flood-color="rgba(0,0,0,0.3)"></feFlood>
            <feComposite in2="offsetblur" operator="in"></feComposite>
            <feMerge>
              <feMergeNode></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
          <radialGradient gradientUnits="userSpaceOnUse" cx="180.18" cy="177.35" r="135.32" id="gradient-0" gradientTransform="matrix(1, 0, 0, 1, 119.653503, -32.825172)">
            <stop offset="0" style="stop-color: rgb(255, 255, 255);"></stop>
            <stop offset="0.25" style="stop-color: rgb(255, 255, 255);"></stop>
            <stop offset="1" style=""></stop>
          </radialGradient>
          <mask id="mask-0">
            <ellipse id="light" style="fill: url(#gradient-0);" cx="299.83" cy="144.52" rx="135.32" ry="135.32"></ellipse>
          </mask>
        </defs>
        <rect x="1.21" y="-0.41" width="599.12" height="302.71" style=""></rect>
        <text style="fill: rgb(7, 7, 7); font-family: Bevan; font-size: 126.749px; white-space: pre;" transform="matrix(0.50493, 0, 0, 0.504935, 72.656082, 168.83783)">SPOTLIGHT</text>
        <g style="mask: url(#mask-0);">
          <rect x="1.12" y="-0.09" width="599.12" height="302.71" style="fill: rgb(77, 77, 77);"></rect>
          <text style="fill: rgb(255, 255, 255); font-family: Bevan; font-size: 126.749px; white-space: pre; filter: url(#drop-shadow-filter-0);" transform="matrix(0.50493, 0, 0, 0.504935, 72.281296, 168.796188)">SPOTLIGHT</text>
        </g>
      </svg>
    </div>
  </main>
</div>
<script type="module" src="scripts.js"></script>
</body>
</html>
