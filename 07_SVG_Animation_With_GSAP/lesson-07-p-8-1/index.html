<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Your creative coding workspace. Explore GSAP, scroll animation, SVG, Adobe Animate, and generative art."
  />
  <title>Creative Coding Club — Learning Library</title>
  <link href="https://fonts.googleapis.com/css?family=Kanit:300,400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">✳</span>
      Creative Coding Club
    </a>
  </header>
  <main>
    <div>
      <h2>Click in the Grid to Start Drawing</h2>
      <svg class="demo" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
        <!-- grid horizontal -->
        <line x1="0" y1="1" x2="500" y2="1" />
        <line x1="0" y1="100" x2="500" y2="100" />
        <line x1="0" y1="200" x2="500" y2="200" />
        <line x1="0" y1="300" x2="500" y2="300" />
        <line x1="0" y1="399" x2="500" y2="399" />

        <!-- grid vertical -->
        <line x1="1" y1="0" x2="1" y2="400" />
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="499" y1="0" x2="499" y2="400" />
        <polyline points="0, 0"/>
        <circle cx="0" cy="0" r="10"/>
      </svg>

      <button id="clear">clear</button>
    </div>
  </main>
</div>
<script type="module" src="scripts.js"></script>
</body>
</html>
